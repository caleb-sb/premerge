name: macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14  # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials Pygments pyinstaller
          python -m pip install --no-deps -e .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/make_icon.py build/premerge.iconset
          iconutil -c icns build/premerge.iconset -o build/premerge.icns

      - name: Build premerge.app
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          pyinstaller --noconfirm --windowed --name premerge \
            --icon build/premerge.icns \
            --osx-bundle-identifier io.github.caleb-sb.premerge \
            --collect-all pygments \
            --copy-metadata premerge \
            premerge/__main__.py
          PLIST=dist/premerge.app/Contents/Info.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$PLIST"
          plutil -replace CFBundleVersion -string "$VERSION" "$PLIST"
          plutil -replace CFBundleDisplayName -string "premerge" "$PLIST"
          plutil -replace LSApplicationCategoryType -string "public.app-category.developer-tools" "$PLIST"
          plutil -replace NSHighResolutionCapable -bool true "$PLIST"
          # Editing Info.plist invalidates PyInstaller's ad-hoc signature; Apple Silicon refuses unsigned code.
          codesign --force --deep --sign - dist/premerge.app
          codesign --verify --deep --strict dist/premerge.app

      - name: Smoke test the bundle
        run: |
          BIN="$PWD/dist/premerge.app/Contents/MacOS/premerge"
          "$BIN" --help
          T=$(mktemp -d)
          git init -q -b main "$T/r"
          cd "$T/r"
          git -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m init
          git checkout -q -b feat/x
          printf 'hello\n' > a.txt
          git add a.txt
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Add a"
          "$BIN" comments
          "$BIN" describe
          # The GUI must start and stay up (offscreen: the runner has no logged-in display for us).
          QT_QPA_PLATFORM=offscreen "$BIN" -C "$T/r" > "$T/gui.log" 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then cat "$T/gui.log"; echo "GUI exited early"; exit 1; fi
          kill "$PID"
          cat "$T/gui.log"

      - name: Build DMG
        run: |
          mkdir -p build/dmg
          cp -R dist/premerge.app build/dmg/
          ln -s /Applications build/dmg/Applications
          DMG="premerge-$VERSION-macos-arm64.dmg"
          hdiutil create -volname premerge -srcfolder build/dmg -ov -format UDZO "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: premerge-macos-arm64
          path: ${{ env.DMG }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" \
            --title "premerge $GITHUB_REF_NAME" \
            --notes "macOS (Apple Silicon) app. Open the DMG and drag premerge.app into Applications (or ~/Applications). The app is not notarized: on first launch, if macOS says it can't verify the developer, open System Settings → Privacy & Security and click **Open Anyway**, or run \`xattr -dr com.apple.quarantine ~/Applications/premerge.app\`."
